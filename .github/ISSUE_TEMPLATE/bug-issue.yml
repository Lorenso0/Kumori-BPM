name: Kumori bug report
description: Report a reproducible problem in Kumori or BPM Adjust.
body:
  - type: markdown
    attributes:
      value: |
        Report only issues specific to this unofficial Kumori build. Reproduce the
        problem with the `--bpm-isolated` profile when possible. General osu! issues
        belong in the upstream ppy/osu project.
  - type: input
    attributes:
      label: Kumori release
      description: For example, 2026.711.0-kumori.1.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Profile
      options:
        - Shared osu profile
        - Isolated osu-bpm profile
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: Include the map, ruleset, target BPM, audio mode, and stat-scaling setting when relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: In game settings, use Export logs and attach the resulting archive. Remove private information first.
    validations:
      required: true
