name: Kumori CI

on:
  workflow_dispatch:
  push:
    branches:
      - kumori
      - bpm-adjust-live-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows x64 build and BPM tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            global.json

      - name: Restore
        run: |
          dotnet restore osu.Desktop.slnf
          dotnet restore osu.Desktop/osu.Desktop.csproj -r win-x64

      - name: Build release client
        run: dotnet build osu.Desktop.slnf -c Release --no-restore -warnaserror

      - name: Test BPM game behavior and safety policy
        run: >
          dotnet test osu.Game.Tests/osu.Game.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ModBPMAdjust|FullyQualifiedName~BPMCustomBuildPolicy"
          --logger "trx;LogFileName=kumori-game-tests.trx"

      - name: Test osu! ruleset BPM behavior
        run: >
          dotnet test osu.Game.Rulesets.Osu.Tests/osu.Game.Rulesets.Osu.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ModBPMAdjust"
          --logger "trx;LogFileName=kumori-osu-tests.trx"

      - name: Build and audit release package
        shell: pwsh
        run: ./scripts/Publish-Release.ps1 -NoRestore

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kumori-test-results
          path: '**/TestResults/*.trx'

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: kumori-release-candidate
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
