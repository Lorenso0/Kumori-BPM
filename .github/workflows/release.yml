name: Kumori Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing Kumori tag to build and release
        required: true
        type: string
  push:
    tags:
      - '20*.*.*-kumori.*'

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  KUMORI_RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}

jobs:
  release:
    name: Build draft GitHub release
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: pwsh
        run: |
          $tag = $env:KUMORI_RELEASE_VERSION
          if ($tag -notmatch '^\d{4}\.\d+\.\d+-kumori\.\d+$') {
            throw "Invalid Kumori release tag: $tag"
          }

          [xml] $props = Get-Content Directory.Build.props
          $releaseProperties = @($props.Project.PropertyGroup) |
                               Where-Object { $_.Label -eq 'Kumori Release' } |
                               Select-Object -First 1
          $upstreamVersion = ([string] $releaseProperties.UpstreamVersion).Trim()
          $revision = ([string] $releaseProperties.KumoriRevision).Trim()
          $expected = "$upstreamVersion-kumori.$revision"
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match KumoriVersion '$expected'."
          }

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            global.json

      - name: Restore pinned build tools
        run: dotnet tool restore

      - name: Restore
        run: |
          dotnet restore osu.Desktop.slnf
          dotnet restore osu.Desktop/osu.Desktop.csproj -r win-x64

      - name: Build release client
        run: dotnet build osu.Desktop.slnf -c Release --no-restore -warnaserror

      - name: Test BPM game behavior and safety policy
        run: >
          dotnet test osu.Game.Tests/osu.Game.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ModBPMAdjust|FullyQualifiedName~BPMCustomBuildPolicy"

      - name: Test osu! ruleset BPM behavior
        run: >
          dotnet test osu.Game.Rulesets.Osu.Tests/osu.Game.Rulesets.Osu.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~ModBPMAdjust"

      - name: Restore previous updater package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $repository = "https://github.com/${{ github.repository }}"
          $assetNames = @(gh api "repos/${{ github.repository }}/releases/latest" --jq '.assets[].name')

          if ($assetNames -contains 'releases.win.json') {
            dotnet tool run vpk -- --skip-updates download github `
              --outputDir artifacts/velopack-base `
              --channel win `
              --repoUrl $repository `
              --token $env:GH_TOKEN

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to restore the previous Velopack release."
            }
          } else {
            Write-Host "The previous release has no Velopack feed; building the bootstrap updater release without a delta."
          }

      - name: Publish and audit
        shell: pwsh
        run: |
          $arguments = @{
            ReleaseVersion = $env:KUMORI_RELEASE_VERSION
            NoRestore = $true
          }

          if (Test-Path -LiteralPath artifacts/velopack-base) {
            $arguments.VelopackBaseDirectory = 'artifacts/velopack-base'
          }

          ./scripts/Publish-Release.ps1 @arguments

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:KUMORI_RELEASE_VERSION
          $zip = "artifacts/releases/kumori-osu-$version-win-x64.zip"
          $checksum = "$zip.sha256"
          $velopack = "artifacts/releases/_work-$version/velopack"
          $velopackAssets = @(
            "$velopack/KumoriBPM-win-Setup.exe",
            "$velopack/KumoriBPM-win-Setup.exe.sha256",
            "$velopack/KumoriBPM-win-Portable.zip",
            "$velopack/KumoriBPM-win-Portable.zip.sha256",
            "$velopack/KumoriBPM-$version-full.nupkg",
            "$velopack/releases.win.json",
            "$velopack/RELEASES"
          )
          $delta = "$velopack/KumoriBPM-$version-delta.nupkg"
          if (Test-Path -LiteralPath $delta) {
            $velopackAssets += $delta
          }

          $intro = Get-Content RELEASE.md -Raw
          gh release create $version $zip $checksum @velopackAssets `
            --generate-notes `
            --verify-tag `
            --title "Kumori $version" `
            --notes $intro

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/releases/*.zip
            artifacts/releases/*.sha256
            artifacts/releases/_work-*/velopack/KumoriBPM-win-Setup.exe
            artifacts/releases/_work-*/velopack/KumoriBPM-win-Portable.zip
