name: Release Kumori ruleset DLL

on:
  push:
    tags:
      - 'ruleset-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (must start with ruleset-v)
        required: true
        type: string

concurrency:
  group: ruleset-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  release:
    name: Build, test, and publish DLL
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^ruleset-v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Invalid ruleset release tag: $env:RELEASE_TAG"
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            global.json

      - name: Restore
        run: dotnet restore osu.Game.Rulesets.Kumori.Tests/osu.Game.Rulesets.Kumori.Tests.csproj

      - name: Test ruleset
        run: dotnet test osu.Game.Rulesets.Kumori.Tests/osu.Game.Rulesets.Kumori.Tests.csproj -c Release --no-restore -warnaserror

      - name: Publish ruleset DLL
        shell: pwsh
        run: ./scripts/Publish-Ruleset.ps1

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $dll = 'artifacts/rulesets/osu.Game.Rulesets.Kumori.dll'
          $checksum = "$(Get-FileHash -LiteralPath $dll -Algorithm SHA256 | Select-Object -ExpandProperty Hash) *osu.Game.Rulesets.Kumori.dll"
          Set-Content -LiteralPath "$dll.sha256" -Value $checksum -Encoding ascii -NoNewline

      - name: Attest DLL provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/rulesets/osu.Game.Rulesets.Kumori.dll

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $dll = 'artifacts/rulesets/osu.Game.Rulesets.Kumori.dll'
          $checksum = "$dll.sha256"

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $dll $checksum --clobber
          } else {
            gh release create $env:RELEASE_TAG $dll $checksum `
              --target $env:GITHUB_SHA `
              --title "Kumori BPM ruleset $env:RELEASE_TAG" `
              --notes-file UPDATE.md
          }

          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publishing failed.'
          }
